<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AJ Mercado</title>

<style>
body {
  font-family: Arial;
  background: #0f0f1a;
  color: white;
  text-align: center;
}

h1 { color: #b366ff; }

input, select, button {
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

button {
  background: purple;
  color: white;
  cursor: pointer;
}

.card {
  background: #1c1c2e;
  padding: 10px;
  margin: 10px;
  border-radius: 12px;
}

.fiado { color: red; }
.pago { color: lime; }
</style>
</head>

<body>

<h1>🛒 AJ Mercado</h1>

<h2>Cliente</h2>
<input id="clienteNome">
<button id="btnCliente">Adicionar</button>

<h2>Produto</h2>
<input id="produtoNome" placeholder="Nome">
<input id="produtoPreco" type="number" placeholder="Preço">
<input id="produtoQtd" type="number" placeholder="Qtd">
<button id="btnProduto">Adicionar</button>

<h2>Venda</h2>
<select id="clientes"></select>
<select id="produtos"></select>
<button id="btnPago">Pago</button>
<button id="btnFiado">Fiado</button>

<div id="lista"></div>

<script>
let clientes = [];
let produtos = [];
let vendas = [];

document.getElementById("btnCliente").addEventListener("click", addCliente);
document.getElementById("btnProduto").addEventListener("click", addProduto);
document.getElementById("btnPago").addEventListener("click", () => addVenda("pago"));
document.getElementById("btnFiado").addEventListener("click", () => addVenda("fiado"));

function addCliente(){
  let input = document.getElementById("clienteNome");
  let nome = input.value.trim();

  if(!nome) return alert("Digite um nome");

  clientes.push(nome);
  input.value = "";
  atualizar();
}

function addProduto(){
  let nome = document.getElementById("produtoNome").value;
  let preco = parseFloat(document.getElementById("produtoPreco").value);
  let qtd = parseInt(document.getElementById("produtoQtd").value);

  if(!nome || isNaN(preco) || isNaN(qtd)){
    return alert("Preencha tudo");
  }

  produtos.push({nome, preco, qtd});
  atualizar();
}

function addVenda(tipo){
  let cliente = document.getElementById("clientes").value;
  let i = document.getElementById("produtos").value;
  let p = produtos[i];

  if(!p || p.qtd <= 0){
    return alert("Sem estoque");
  }

  p.qtd--;

  vendas.push({
    cliente,
    produto: p.nome,
    preco: p.preco,
    tipo
  });

  atualizar();
}

function remover(i){
  vendas.splice(i,1);
  atualizar();
}

function atualizar(){
  let clientesSelect = document.getElementById("clientes");
  let produtosSelect = document.getElementById("produtos");
  let lista = document.getElementById("lista");

  clientesSelect.innerHTML = "";
  produtosSelect.innerHTML = "";
  lista.innerHTML = "";

  clientes.forEach(c=>{
    let o = document.createElement("option");
    o.value = c;
    o.textContent = c;
    clientesSelect.appendChild(o);
  });

  produtos.forEach((p,i)=>{
    let o = document.createElement("option");
    o.value = i;
    o.textContent = `${p.nome} R$${p.preco} [${p.qtd}]`;
    produtosSelect.appendChild(o);
  });

  clientes.forEach(c=>{
    let div = document.createElement("div");
    div.className = "card";

    let total = 0;

    vendas.forEach(v=>{
      if(v.cliente === c && v.tipo === "fiado"){
        total += v.preco;
      }
    });

    div.innerHTML = `<h3>${c}</h3><p>Fiado: R$${total.toFixed(2)}</p>`;

    vendas.forEach((v,i)=>{
      if(v.cliente === c){
        let p = document.createElement("p");
        p.innerHTML = `
          ${v.produto} - R$${v.preco}
          <b class="${v.tipo}">${v.tipo}</b>
          <button>❌</button>
        `;

        p.querySelector("button").addEventListener("click", () => remover(i));
        div.appendChild(p);
      }
    });

    lista.appendChild(div);
  });
}

atualizar();
</script>

</body>
</html>
