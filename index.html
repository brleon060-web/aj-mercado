<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AJ Mercado</title>

<style>
body {
  font-family: Arial;
  background: #0f0f1a;
  color: white;
  text-align: center;
}

h1 { color: #b366ff; }

input, select {
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
  border: none;
  background: purple;
  color: white;
  cursor: pointer;
}

.card {
  background: #1c1c2e;
  padding: 10px;
  margin: 10px;
  border-radius: 12px;
}

.fiado { color: red; }
.pago { color: lime; }
</style>

</head>
<body>

<h1>🛒 AJ Mercado (Allyson & Junior)</h1>

<h2>Cliente</h2>
<input id="clienteNome" placeholder="Nome do cliente">
<button onclick="addCliente()">Adicionar</button>

<h2>Produto</h2>
<input id="produtoNome" placeholder="Nome">
<input id="produtoPreco" type="number" placeholder="Preço">
<input id="produtoQtd" type="number" placeholder="Quantidade">
<button onclick="addProduto()">Adicionar</button>

<h2>Venda</h2>
<select id="clientes"></select>
<select id="produtos"></select>
<button onclick="addVenda('pago')">Pago</button>
<button onclick="addVenda('fiado')">Fiado</button>

<h2>Clientes</h2>
<div id="lista"></div>

<script>
let clientes = [];
let produtos = [];
let vendas = [];

function addCliente(){
  let input = document.getElementById("clienteNome");
  let nome = input.value.trim();

  if(!nome){
    alert("Digite um nome");
    return;
  }

  clientes.push(nome);
  input.value = "";
  atualizar();
}

function addProduto(){
  let nome = document.getElementById("produtoNome").value;
  let preco = parseFloat(document.getElementById("produtoPreco").value);
  let qtd = parseInt(document.getElementById("produtoQtd").value);

  if(!nome || isNaN(preco) || isNaN(qtd)){
    alert("Preencha tudo");
    return;
  }

  produtos.push({nome, preco, qtd});
  atualizar();
}

function addVenda(tipo){
  let cliente = document.getElementById("clientes").value;
  let i = document.getElementById("produtos").value;
  let p = produtos[i];

  if(!p || p.qtd <= 0){
    alert("Sem estoque");
    return;
  }

  p.qtd--;

  vendas.push({
    cliente,
    produto: p.nome,
    preco: p.preco,
    tipo
  });

  atualizar();
}

function remover(i){
  vendas.splice(i,1);
  atualizar();
}

function atualizar(){
  let clientesSelect = document.getElementById("clientes");
  let produtosSelect = document.getElementById("produtos");
  let lista = document.getElementById("lista");

  clientesSelect.innerHTML = "";
  produtosSelect.innerHTML = "";
  lista.innerHTML = "";

  clientes.forEach(c=>{
    let o = document.createElement("option");
    o.value = c;
    o.textContent = c;
    clientesSelect.appendChild(o);
  });

  produtos.forEach((p,i)=>{
    let o = document.createElement("option");
    o.value = i;
    o.textContent = `${p.nome} R$${p.preco} [${p.qtd}]`;
    produtosSelect.appendChild(o);
  });

  clientes.forEach(c=>{
    let div = document.createElement("div");
    div.className = "card";

    let total = 0;

    vendas.forEach(v=>{
      if(v.cliente === c && v.tipo === "fiado"){
        total += v.preco;
      }
    });

    div.innerHTML = `<h3>${c}</h3><p>Total fiado: R$${total.toFixed(2)}</p>`;

    vendas.forEach((v,i)=>{
      if(v.cliente === c){
        div.innerHTML += `
          <p>
            ${v.produto} - R$${v.preco}
            <b class="${v.tipo}">${v.tipo}</b>
            <button onclick="remover(${i})">❌</button>
          </p>
        `;
      }
    });

    lista.appendChild(div);
  });
}

atualizar();
</script>

</body>
</html>
